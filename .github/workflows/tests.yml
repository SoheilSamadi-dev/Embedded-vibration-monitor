name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python and C++ tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build C++ calculation tests
        run: |
          mkdir -p build/tests
          c++ -std=c++11 -Wall -Wextra -pedantic tests/test_vibration.cpp -o build/tests/test_vibration
      - name: Run C++ calculation tests
        run: ./build/tests/test_vibration
      - name: Check logger shell syntax
        run: bash -n linux/logger.sh
